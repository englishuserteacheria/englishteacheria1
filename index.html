<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English User Teacher IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #1f2937; text-align: center; }
        header { background: #123c69; color: white; padding: 25px 20px; text-align: center; }
        header img { max-width: 160px; height: auto; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
        header h1 { font-size: 28px; margin-bottom: 6px; }
        header p { font-size: 16px; opacity: 0.9; font-style: italic; }
        .container { max-width: 1000px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .levels { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
        .level-card { background: #f9f9f9; padding: 20px; border-radius: 6px; width: 220px; border: 1px solid #ddd; }
        .level-title { font-weight: bold; color: #123c69; font-size: 1.1rem; }
        .level-code { font-size: 1.5rem; margin: 10px 0; font-weight: 600; color: #123c69; }
        .lessons-section { margin-top: 40px; text-align: left; }
        .lesson-list { list-style: none; padding: 0; }
        .lesson-list li { background: #f0f4f8; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
        .lesson-list li a { color: #123c69; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <img src="levelone/english-degradado.jpg" alt="Logo English User Teacher IA">
        <h1>english user Teacher IA</h1>
        <p>connect with the world</p>
    </header>

    <div class="container">
        <h2>Welcome!</h2>
        <p>Select your level to begin your English lessons.</p>

        <div class="levels">
            <div class="level-card">
                <div class="level-title">Level 1</div>
                <div class="level-code">A1</div>
                <div style="color: #555;">Beginner</div>
            </div>
            <div class="level-card">
                <div class="level-title">Level 2</div>
                <div class="level-code">A2</div>
                <div style="color: #555;">Basic</div>
            </div>
            <div class="level-card">
                <div class="level-title">Level 3</div>
                <div class="level-code">B1</div>
                <div style="color: #555;">Intermediate</div>
            </div>
            <div class="level-card">
                <div class="level-title">Level 4</div>
                <div class="level-code">B2</div>
                <div style="color: #555;">Upper-Intermediate</div>
            </div>
        </div>

        <div class="lessons-section">
            <h3>Level A1 Lessons</h3>
            <ul class="lesson-list">
                <li><a href="levelone/level1_reading1.html">Lesson 1</a></li>
                <li>Lesson 2</li>
                <li>Lesson 3</li>
                <li>Lesson 4</li>
                <li>Lesson 5</li>
            </ul>
        </div>
    </div>

</body>
</html>
