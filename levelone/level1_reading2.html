    <script>
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Sorry, your browser does not support speech synthesis.');
            }
        }
        function toggleMarisolChat() {
            const chatBox = document.getElementById('marisol-chat-box');
            const badge = document.querySelector('.marisol-badge');
            if (chatBox.style.display === 'none' || chatBox.style.display === '') {
                chatBox.style.display = 'flex';
                if(badge) badge.style.display = 'none';
            } else {
                chatBox.style.display = 'none';
            }
        }
        function sendMarisolMsg() {
            const input = document.getElementById('marisol-chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            appendMarisolMessage(msg, 'student');
            input.value = '';
            setTimeout(() => {
                appendMarisolMessage("Keep practicing your vocabulary and dialogues! You're doing great.", 'teacher');
            }, 1000);
        }
        function appendMarisolMessage(text, sender) {
            const chatBody = document.getElementById('marisol-chat-body');
            const msgDiv = document.createElement('div');
            msgDiv.className = `marisol-msg ${sender}`;
            msgDiv.textContent = text;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
        function handleMarisolKeyPress(event) {
            if (event.key === 'Enter') {
                sendMarisolMsg();
            }
        }
        function startMarisolVoice() {
            alert("Microphone feature for chat is not integrated yet. Please type your message.");
        }
    </script>
